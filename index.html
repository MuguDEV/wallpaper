<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLLPR - Premium Procedural Wallpaper Studio</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 900: '#18181b', 950: '#09090b' },
                        brand: { 500: '#3b82f6' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 dark:bg-[#0c0c0c] text-gray-900 dark:text-gray-100 h-screen w-screen overflow-hidden flex font-sans selection:bg-brand-500 selection:text-white">

    <!-- Left Sidebar (Navigation & Library) -->
    <aside id="left-sidebar" class="w-72 h-full flex flex-col border-r border-gray-200 dark:border-white/10 bg-white/50 dark:bg-zinc-950/50 backdrop-blur-xl z-20 shrink-0 transition-all duration-300">
        <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-white/10">
            <div class="flex items-center gap-2 cursor-pointer">
                <div class="w-8 h-8 rounded-lg bg-black dark:bg-white flex items-center justify-center shadow-lg">
                    <span class="text-white dark:text-black font-bold text-sm tracking-tighter">WP</span>
                </div>
                <h1 class="font-semibold tracking-wide text-lg">WLLPR</h1>
            </div>
            <button class="p-1.5 rounded-md hover:bg-gray-200 dark:hover:bg-white/10 text-gray-500 dark:text-gray-400 transition" title="Toggle Sidebar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <div class="p-4">
            <div class="relative group">
                <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="global-search" placeholder="Search... (Ctrl+K)" class="w-full bg-gray-100 dark:bg-white/5 border border-transparent dark:border-white/5 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-zinc-900 transition-all">
                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-400 bg-gray-200 dark:bg-white/10 px-1.5 py-0.5 rounded border border-gray-300 dark:border-white/10 font-mono">⌘K</span>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto px-2 custom-scrollbar pb-4 space-y-6">
            <!-- Navigation -->
            <nav class="space-y-1">
                <a href="#" class="nav-item active flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 dark:bg-white/10 text-black dark:text-white">
                    <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Algorithms
                </a>
                <a href="#" id="nav-favorites" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-white/5 text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white transition-colors">
                    <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    Favorites
                </a>
                <a href="#" id="nav-history" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-white/5 text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white transition-colors">
                    <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    History
                </a>
            </nav>

            <!-- Library / Algorithms -->
            <div class="px-2">
                <h3 class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3">Library</h3>
                <div class="space-y-4" id="categories-container">
                    <!-- Dynamic Categories & Algorithms will go here -->
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-gray-200 dark:border-white/10 flex items-center gap-2">
            <button id="btn-randomize" class="flex-1 py-2 bg-black dark:bg-white text-white dark:text-black rounded-lg text-sm font-medium hover:scale-[1.02] transition shadow-md flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Randomize
            </button>
            <button id="theme-toggle" class="p-2 border border-gray-200 dark:border-white/10 rounded-lg hover:bg-gray-100 dark:hover:bg-white/5 transition text-gray-600 dark:text-gray-400" title="Toggle Theme">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </aside>

    <!-- Center Canvas Area -->
    <main class="flex-grow h-full flex flex-col relative z-10 bg-gray-100/50 dark:bg-black/20 overflow-hidden">

        <!-- Top Tab Bar -->
        <header class="h-14 flex items-center justify-between px-4 border-b border-gray-200 dark:border-white/10 bg-white/50 dark:bg-zinc-950/50 backdrop-blur-md">
            <div class="flex gap-1" id="preview-tabs">
                <button class="px-3 py-1.5 rounded-md text-sm font-medium bg-white dark:bg-white/10 text-black dark:text-white shadow-sm border border-gray-200 dark:border-transparent transition" data-view="desktop">Desktop</button>
                <button class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-200/50 dark:hover:bg-white/5 transition" data-view="laptop">Laptop</button>
                <button class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-200/50 dark:hover:bg-white/5 transition" data-view="tablet">Tablet</button>
                <button class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-200/50 dark:hover:bg-white/5 transition" data-view="mobile">Mobile</button>
                <button class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-200/50 dark:hover:bg-white/5 transition" data-view="ultrawide">UltraWide</button>
                <button class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-black dark:hover:text-white hover:bg-gray-200/50 dark:hover:bg-white/5 transition" data-view="dual">Dual Monitor</button>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-400 mr-2" id="canvas-size-info">3840 x 2160</span>
                <button class="p-1.5 rounded-md hover:bg-gray-200 dark:hover:bg-white/10 text-gray-500 dark:text-gray-400 transition" title="Fit to Screen">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
                <div class="h-4 w-px bg-gray-300 dark:bg-gray-700 mx-1"></div>
                <button id="favorite-btn" class="p-1.5 rounded-md hover:bg-gray-200 dark:hover:bg-white/10 text-gray-500 dark:text-gray-400 transition" title="Save to Favorites">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="favorite-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </button>
                <button id="export-btn" class="px-3 py-1.5 rounded-md text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white transition flex items-center gap-1.5 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export
                </button>
            </div>
        </header>

        <!-- Canvas Container -->
        <div class="flex-grow relative overflow-hidden flex items-center justify-center p-8 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] dark:bg-[radial-gradient(#ffffff15_1px,transparent_1px)] [background-size:20px_20px]" id="canvas-wrapper">

            <div id="canvas-container" class="shrink-0 relative shadow-2xl transition-all duration-300 transform origin-center bg-black rounded-sm overflow-hidden flex items-center justify-center">
                <!-- p5 canvas injected here -->
                <div id="mock-clock" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-start pt-[15%] text-white drop-shadow-md z-10 transition-opacity">
                    <div class="text-[0.8em] tracking-widest uppercase mb-1 opacity-90" id="clock-date">Sunday, 14 June</div>
                    <div class="text-[3em] font-medium leading-none" id="clock-time">09:41</div>
                </div>
            </div>

            <!-- Zoom Controls Floating -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-1 p-1 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md rounded-full shadow-lg border border-gray-200 dark:border-white/10">
                <button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-200 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
                <span class="text-xs font-medium w-12 text-center text-gray-700 dark:text-gray-200">100%</span>
                <button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-200 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Right Sidebar (Properties / Customization) -->
    <aside id="right-sidebar" class="w-80 h-full flex flex-col border-l border-gray-200 dark:border-white/10 bg-white/50 dark:bg-zinc-950/50 backdrop-blur-xl z-20 shrink-0 transition-all duration-300">

        <div class="h-14 flex items-center px-4 border-b border-gray-200 dark:border-white/10 shrink-0">
            <h2 class="font-medium text-sm">Properties</h2>
        </div>

        <div class="flex-grow overflow-y-auto custom-scrollbar p-4 space-y-6">

            <!-- Dynamic Algorithm Settings -->
            <section>
                <div class="flex items-center justify-between mb-3 cursor-pointer group">
                    <h3 class="text-xs font-semibold text-gray-900 dark:text-gray-100 uppercase tracking-wider">Algorithm Settings</h3>
                    <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="space-y-4" id="dynamic-controls">
                    <!-- Sliders & Toggles injected here -->
                    <div class="text-xs text-gray-500 italic">Select an algorithm to view settings.</div>
                </div>
            </section>

            <hr class="border-gray-200 dark:border-white/10">

            <!-- Colors -->
            <section>
                <div class="flex items-center justify-between mb-3 cursor-pointer group">
                    <h3 class="text-xs font-semibold text-gray-900 dark:text-gray-100 uppercase tracking-wider">Colors</h3>
                    <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>

                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-600 dark:text-gray-400">Palette</span>
                        <select id="palette-select" class="bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded px-2 py-1 text-xs text-gray-900 dark:text-white outline-none focus:ring-1 focus:ring-brand-500">
                            <!-- Populated by JS -->
                        </select>
                    </div>

                    <div class="flex gap-2 p-2 bg-gray-100 dark:bg-white/5 rounded-lg border border-gray-200 dark:border-white/10" id="color-swatches">
                        <!-- Swatches injected here -->
                    </div>

                    <button id="edit-palette-btn" class="w-full py-1.5 border border-gray-200 dark:border-white/10 rounded-md text-xs font-medium hover:bg-gray-100 dark:hover:bg-white/5 transition">
                        Edit Palette
                    </button>
                </div>
            </section>

            <hr class="border-gray-200 dark:border-white/10">

            <!-- Effects -->
            <section>
                <div class="flex items-center justify-between mb-3 cursor-pointer group">
                    <h3 class="text-xs font-semibold text-gray-900 dark:text-gray-100 uppercase tracking-wider">Effects & Textures</h3>
                    <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <div class="space-y-3" id="effects-controls">
                    <!-- Effects list -->
                </div>
            </section>

        </div>
    </aside>

    <!-- Hidden Canvas for High-Res Generation -->
    <div id="high-res-container" style="display:none;"></div>

    <script src="js/storage.js"></script>
    <script src="js/palettes.js"></script>
    <script src="js/algorithms.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/app.js"></script>
    <script src="js/history-favorites.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
